# Note: bundle owns installation and ready wiring — 见 .agents/notes/implemented/architecture/2026-09-24-distributable-dsh-bundle.md。
# Keep this id for compatibility with existing file-based profiles.
- insert:
    - id: local-dsh-default-overrides
      name: dsh-default-overrides
      config: {}

- id: preset-standard
  inject:
    - dshDefaultOverridesReady

# Note: harness:identity 由全局 system-prompt 行注册，只有该行等到 ready 后
# 本插件才能改写它的 includeHarnessIdentity — 见 .agents/notes/implemented/feature/2026-09-24-configurable-harness-identity.md。
# 该行自身没有 inject，因此这里只增加等待，不覆盖任何原有依赖。
- id: system-prompt
  inject:
    - dshDefaultOverridesReady
