# Note: bundle owns installation and ready wiring — 见 .agents/notes/implemented/architecture/2026-09-24-distributable-dsh-bundle.md。
# 行 ID 与包名一致，是用户配置层的唯一锚点；改名属破坏性变更，迁移见
# dsh-default-overrides-migration.md，决定见 .agents/notes/implemented/architecture/2026-10-08-config-row-id-rename.md。
- insert:
    - id: dsh-default-overrides
      name: dsh-default-overrides
      config: {}

# Note: standard 预设的工具行补丁在 internal/config 阶段生效，预设行必须先等到本插件就绪，
# 否则它的 config 已经解析完，disabledTools 补丁会静默丢失。
- id: preset-standard
  inject:
    - dshDefaultOverridesReady

# Note: harness:identity 由全局 system-prompt 行注册，只有该行等到 ready 后
# 本插件才能改写它的 includeHarnessIdentity — 见 .agents/notes/implemented/feature/2026-09-24-configurable-harness-identity.md。
# 该行自身没有 inject，因此这里只增加等待，不覆盖任何原有依赖。
- id: system-prompt
  inject:
    - dshDefaultOverridesReady

# Note: DSH_WEB_URL 由 web-runtime 行（dsh-web-app bundle）按 surfaceContext 注册，
# 该行必须先等到本插件就绪。webStartup 是它原有的依赖，覆盖 inject 时必须保留，
# 否则 launcher 参数（host/port/openBrowser/trustedHosts）的 !!js 表达式全部求值失败
# — 见 .agents/notes/implemented/feature/2026-10-08-configurable-surface-context.md。
- id: web-runtime
  inject:
    - webStartup
    - dshDefaultOverridesReady
