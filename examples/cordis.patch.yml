# Merge into $DSH_HOME/profiles/<profile>/cordis.patch.yml AFTER bundle installation.
# This updates the bundle-owned entry; do not insert a second plugin instance.
- id: dsh-default-overrides
  config:
    # Hide the global harness:identity section for the whole profile.
    includeHarnessIdentity: false
    # Hide the Web surface prompts (harness:source, app:web-surface) and DSH_WEB_URL.
    surfaceContext: false
    # Optional custom system prompt section injected globally at order 200 (after persona prefix, before tools).
    extraSystemPrompt: |
      Batch independent read, glob, and grep tool calls in parallel.
      Prefer dedicated tools over bash unless running builds, tests, or git.
    # Standard preset row ids to disable; omit the key to keep every shipped row.
    disabledTools:
      - tool-web
      - tool-workflow

# The bundle supplies the ready gate for preset-standard, system-prompt and web-runtime.
# If another patch overrides inject, retain dshDefaultOverridesReady alongside that
# patch's other dependencies; keep webStartup on the web-runtime row.
