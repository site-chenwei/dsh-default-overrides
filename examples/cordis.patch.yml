# Merge into $DSH_HOME/profiles/<profile>/cordis.patch.yml AFTER bundle installation.
# This updates the bundle-owned entry; do not insert a second plugin instance.
- id: dsh-default-overrides
  config:
    # Hide the global harness:identity section for the whole profile.
    includeHarnessIdentity: false
    # Hide the Web surface prompts (harness:source, app:web-surface) and DSH_WEB_URL.
    surfaceContext: false
    # Only listed presets receive this persona; [] disables all overrides.
    personaPresets:
      - standard
      - ptc
      - cordis
    persona:
      prefix: 'You are a helpful software engineer assistant.'
    # Standard preset row ids to disable; omit the key to keep every shipped row.
    disabledTools:
      - tool-web
      - tool-workflow
    # Disable native automatic compaction in every preset that ships a compaction-basic row.
    autoCompaction: false

# The bundle supplies the ready gate for preset-standard, preset-ptc, preset-cordis,
# preset-minimal, system-prompt and web-runtime. If another patch overrides inject,
# retain dshDefaultOverridesReady alongside that patch's other dependencies; keep
# webStartup on the web-runtime row.
