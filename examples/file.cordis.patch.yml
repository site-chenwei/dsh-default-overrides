# Legacy file deployment only; do not combine with the installed bundle.
# Replace the entry URL with the actual location of scripts/dsh-default-overrides.mjs.
- insert:
    - id: dsh-default-overrides
      name: 'file:///Users/me/dsh-default-overrides/scripts/dsh-default-overrides.mjs'
      config:
        includeHarnessIdentity: false
        surfaceContext: false
        disabledTools:
          - tool-web

# Retain any other existing inject dependencies on these rows.
- id: preset-standard
  inject:
    - dshDefaultOverridesReady
- id: system-prompt
  inject:
    - dshDefaultOverridesReady
# Keep webStartup: it carries the launcher host, port, browser and trusted-host values.
- id: web-runtime
  inject:
    - webStartup
    - dshDefaultOverridesReady
